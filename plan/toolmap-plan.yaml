# Register for results/toolmap.json, merged in by bench/toolmap.mjs.
#
# Measured cells come from the runs. This file holds what a run cannot say:
# the tools, the cells that are not measured and why, and rows that are
# planned before anything is measured. A planned row points to a dated test
# design under plan/, committed before the run, so the design cannot be
# fitted to the results afterwards.

states:
  measured: a value from a run; see the cell's source_report
  planned: a dated test design is committed (see plan); nothing is measured yet
  open: a sensible test that nobody has designed yet
  not_applicable: the tool cannot do the task; see reason

tools:
  jev:
    name: Jev (jev-latest, measured as jev-1.13.0)
    maker: TypeSafe AI, Inc., San Francisco, CA
    runs: >-
      hosted API (api.typesafe.ai). TypeSafe's privacy policy says the
      services are hosted in the United States.
    licence: >-
      proprietary hosted service, no weights or code published; use is
      governed by TypeSafe's terms
    primitives: choice, score, noul
    sources:
      - https://typesafe.ai/legal/privacy-policy (section International Visitors, last updated 2025-11-19, read 2026-10-09)
      - https://typesafe.ai/legal/terms (offered by TypeSafe AI, Inc., 255 California St, San Francisco; last updated 2026-09-19, read 2026-10-09)
      - https://docs.typesafe.ai/introduction (three primitives choice, score, noul, read 2026-10-09)
  gliner:
    name: GLiNER2 / GLiNER2.5 (Decide classifiers and entity extractors)
    maker: Fastino
    runs: >-
      local, Python package gliner2 with the weights from Hugging Face, on
      one RTX 4090
    licence: >-
      Apache-2.0, for the gliner2 library and for every model measured here
      (GLiNER2.5-multi-Decide, GLiNER2.5-Decide, GLiNER2.5-Decide-1B,
      gliner2.5-multi-v1, gliner2-large-v1)
    sources:
      - https://github.com/fastino-ai/GLiNER2 (licence Apache-2.0, read 2026-10-09)
      - https://huggingface.co/fastino (model cards, license apache-2.0 in each card's metadata, read 2026-10-09)
  local-llm:
    name: open LLM through Ollama; the arm measured in route1 and ex1 is Winnow-12B (Q8_0)
    maker: >-
      EldanRing (Winnow-12B, a Gemma 4 12B IT with a merged LoRA). pv1 also
      measured Qwen3 32B, Qwen3.8 27B and shisa-de-1, see results/pv1/method.md
    runs: local, Ollama on one RTX 4090
    licence: >-
      Apache-2.0 for Winnow-12B (license field of its model card; base model
      google/gemma-4-12B-it). Other local models carry their own licences
    sources:
      - https://huggingface.co/EldanRing/Winnow-12B (license apache-2.0, base_model google/gemma-4-12B-it, read 2026-10-09)

  classic:
    name: >-
      sentence embeddings (intfloat/multilingual-e5-base) plus a scikit-learn
      LogisticRegression trained on labelled examples
    maker: >-
      Microsoft (multilingual-e5-base, published as intfloat on Hugging
      Face, Wang et al., arXiv:2402.05672) and the scikit-learn developers
      (LogisticRegression); the training here is ours, see plan/t3.md
    runs: >-
      local, Python with sentence-transformers and scikit-learn, on a Mac
      (Apple silicon, MPS); no GPU server needed
    licence: >-
      MIT for multilingual-e5-base (card metadata), BSD-3-Clause for
      scikit-learn, Apache-2.0 for sentence-transformers. The trained
      classifier inherits the licence of its training data (MASSIVE, CC BY 4.0)
    sources:
      - https://huggingface.co/intfloat/multilingual-e5-base (license mit, revision d128750597153bb5987e10b1c3493a34e5a4502a, read 2026-10-09)
      - https://github.com/scikit-learn/scikit-learn (licence BSD-3-Clause, read 2026-10-09)
      - https://github.com/UKPLab/sentence-transformers (licence Apache-2.0, read 2026-10-09)

# Cells of measured rows that have no measurement.
cells:
  ex1-slots-de:
    jev: &jev-no-extraction
      state: not_applicable
      reason: Jev has no extraction primitive (choice, score, noul only), docs.typesafe.ai/introduction
      source_report: results/ex1/method.md
    classic: &classic-no-slots
      state: open
      reason: >-
        a trained slot tagger is possible (MASSIVE train has slot
        annotations) but is a different model; T3 covers classification only
      plan: plan/t3.md
  ex1-slots-en:
    jev: *jev-no-extraction
    classic: *classic-no-slots
  route1-fastdec26-en:
    classic:
      state: not_applicable
      reason: >-
        fast-decisions publishes only the dev split, no train split, so the
        classic classifier has nothing to train on (plan/t3.md)
      plan: plan/t3.md
  pv1-is_req-de:
    classic: &classic-no-pv1
      state: not_applicable
      reason: >-
        no labelled training data for this task; the only labels are the
        blind reference of the test rows themselves (plan/t3.md)
      plan: plan/t3.md
  pv1-is_req-en:
    classic: *classic-no-pv1
  pv1-must-de:
    classic: *classic-no-pv1
  pv1-must-en:
    classic: *classic-no-pv1
  pv1-axis-de:
    classic: *classic-no-pv1
  pv1-axis-en:
    classic: *classic-no-pv1
  pv1-evidence-de:
    classic: *classic-no-pv1
  pv1-evidence-en:
    classic: *classic-no-pv1
  pv1-level-de:
    classic: *classic-no-pv1
  pv1-level-en:
    classic: *classic-no-pv1

# Rows that exist before any measurement.
rows:
  - id: einv1-yesno-de
    kind: yesno
    task: >-
      yes/no question over the free text of an e-invoice (KoSIT XRechnung
      test suite, 34 invoices, ten questions)
    lang: de
    metric: accuracy against a blind reference, pooled over 340 cells and per question
    plan: plan/einv1.md
    cells:
      jev: &einv1-planned
        state: planned
        plan: plan/einv1.md
      gliner: *einv1-planned
      local-llm: *einv1-planned
      classic:
        state: not_applicable
        reason: >-
          no labelled training data; the 34 invoices are the test set
          (plan/t3.md)
        plan: plan/t3.md

# Capability rows (plan/ROADMAP.md, family C1 to C9): what one RTX 4090 does
# on its own with open models. They are not tool-family comparisons, so they
# sit in their own list (`capabilities` in results/toolmap.json) with one
# cell, `local` (best local model by the roadmap rule). A row is measured
# when results/capabilities.json, written by bench/score-cap.py, has it;
# until then it is planned and points to its dated design.
capabilities:
  - id: C1
    capability: "German retrieval for RAG (embedders, then rerankers)"
    metric: "nDCG@10 on MIRACL de dev"
    plan: plan/c1.md
  - id: C2
    capability: "German speech to text"
    metric: "WER on FLEURS de_de test (lower is better)"
    plan: plan/c2.md
  - id: C3
    capability: "invoice fields from rendered e-invoices (also T8)"
    metric: "field exact match over 408 cells"
    plan: plan/c3.md
  - id: C4
    capability: "structured output and tool calling"
    metric: "AST accuracy and schema validity"
    plan: plan/c4.md
  - id: C5
    capability: "translation German to English and English to German"
    metric: "chrF++ on FLORES+ devtest"
    plan: plan/c5.md
  - id: C6
    capability: "German reading comprehension"
    metric: "F1 on GermanQuAD test"
    plan: plan/c6.md
  - id: C7
    capability: "long context from 4k to 32k tokens"
    metric: "accuracy per context length"
    plan: plan/c7.md
  - id: C8
    capability: "throughput and energy per model size"
    metric: "tokens per second and joules per 1,000 tokens"
    plan: plan/c8.md
  - id: C9
    capability: "personal data detection in German text (also T7)"
    metric: "span F1 and recall"
    plan: plan/c9.md
